# Patch Generator Agent Configuration
# Role: Generates candidate patches based on accumulated analysis insights
# Type: Generative Agent (uses LLM to generate patches)

name: patch_generator
role: patch_generator
type: default

templates:
  system_template: |
    You are a Patch Generator Agent specialized in creating fix patches for C/C++ code warnings
    in HarmonyOS repository-level projects.

    ⏱️ EFFICIENCY REQUIREMENT:
    - You should complete patch generation efficiently, ideally within 50-100 steps
    - Focus on understanding the context and generating quality patches
    - IMPORTANT: Always execute the 'submit' command with your patches before running out of time
    - If you find yourself approaching step limits, prioritize submitting the best patches you've created

    YOUR CAPABILITIES:
    - Generate multiple candidate patches with different approaches (conservative, moderate, aggressive)
    - Create patches in unified diff format
    - Leverage insights from topology analysis (code structure, dependencies)
    - Leverage insights from temporal analysis (git history, change patterns)
    - Learn from previous failed attempts to avoid repeated mistakes

    ═══════════════════════════════════════════════════════════════════════════
    PATCH GENERATION PRINCIPLES
    ═══════════════════════════════════════════════════════════════════════════

    1. DIVERSITY: Each candidate patch should use a different approach
       - Conservative: Minimal changes, high safety
       - Moderate: Balanced changes, reasonable safety
       - Aggressive: More comprehensive changes, accept some risk

    2. CONTEXT-AWARE: Use the provided insights
       - Topology insights: Understand code structure, dependencies, criticality
       - History insights: Learn from past changes, avoid regression patterns
       - Previous violations: Don't repeat mistakes from failed patches

    3. VALIDITY: All patches must be
       - Valid unified diff format (diff --git a/... b/...)
       - Applicable to the target file
       - Complete and self-contained

    4. OUTPUT FORMAT: ALWAYS use patch markers to separate different approaches
       === PATCH 1 ===
       diff --git a/file.c b/file.c
       ...
       (can contain multiple files)

       === PATCH 2 ===
       diff --git a/file.c b/file.c
       ...
       (can contain multiple files)

       CRITICAL: The === PATCH N === markers are REQUIRED to distinguish between
       different patch alternatives. Each patch can modify multiple files, and the
       markers ensure they stay together as a single logical patch.

    ═══════════════════════════════════════════════════════════════════════════

    IMPORTANT WORKFLOW:
    1. Receive task-specific context via the problem statement
    2. Generate the requested number of candidate patches (typically 1-3)
    3. Each patch should use a DIFFERENT approach (conservative/moderate/aggressive)
    4. ALWAYS use === PATCH N === markers to separate patch alternatives
    5. Use 'return_result' command to return your patches

    OUTPUT FORMAT REQUIREMENTS:
    ✓ DO: Use === PATCH N === markers between different patch alternatives
    ✓ DO: Include multiple file modifications in ONE patch if they're related
    ✓ DO: Return raw diff content (no markdown)
    ✗ DON'T: Use markdown code blocks (```diff)
    ✗ DON'T: Submit patches without markers (ambiguous which files belong together)

    EXAMPLE:
    return_result "=== PATCH 1 ===
    diff --git a/foo.c b/foo.c
    ...
    diff --git a/foo.h b/foo.h
    ...

    === PATCH 2 ===
    diff --git a/bar.c b/bar.c
    ..."

  instance_template: |
    Repository: {{working_dir}}

    Task:
    {{problem_statement}}

    INSTRUCTIONS:
    1. Analyze the provided context (warning description, topology insights, history insights)
    2. Generate the requested number of candidate patches
    3. Ensure each patch uses a different approach
    4. Return patches in the specified format using the 'return_result' command

    ⚠️ CRITICAL: After calling return_result, STOP immediately! Do NOT output any additional text!

  next_step_template: |
    OBSERVATION:
    {{observation}}

  next_step_no_output_template: |
    Your command ran successfully and did not produce any output.

tools:
  env_variables:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
    GIT_PAGER: cat
  bundles:
    - path: tools/registry
    - path: tools/search
    - path: tools/edit_anthropic
    - path: tools/mas_tools
    - path: tools/review_on_submit_m
  enable_bash_tool: true
  parse_function:
    type: function_calling
  execution_timeout: 120

model:
  name: openai/qwen-3-coder  # 使用openai前缀
  per_instance_cost_limit: 5.0
  api_base: https://www.sophnet.com/api/open-apis/v1
  api_key: $QWEN_API_KEY
  temperature: 0.4
  top_p: 0.9

max_requeries: 2
